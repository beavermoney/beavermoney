name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  web-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Vitest
        run: pnpm test

  web-checks:
    name: Frontend Checks
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./web
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Prettier check
        run: pnpm format . --check

      - name: Run TSC check
        run: pnpm tsc --noEmit

      - name: Run ESLint check
        run: pnpm lint

      - name: Run Vite build
        run: pnpm build

  server-checks:
    name: Server Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache-dependency-path: go.sum

      - name: Run golangci-lint check
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.11.4

      - name: Tidy Go modules
        run: go mod tidy && git diff --exit-code go.mod go.sum

      - name: Build Go application
        run: go build -v ./...

  server-tests:
    name: Server Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: beaver_review_compat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d beaver_review_compat_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      REVIEW_TEST_DATABASE_URL: postgresql://user:password@localhost:5432/beaver_review_compat_test?sslmode=disable
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: "go.mod"
          cache-dependency-path: go.sum

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap snapshot database through real forward migrations
        run: go run ./scripts/fixtures/review-setup

      - name: Verify legacy and prototype snapshot migration compatibility
        run: psql "$REVIEW_TEST_DATABASE_URL" -v ON_ERROR_STOP=1 -f scripts/fixtures/review-compatibility.sql

      - name: Run Go tests including PostgreSQL snapshot regressions
        run: go test -race -count=1 ./...
