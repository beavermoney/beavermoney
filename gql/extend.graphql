extend type Household {
  financialReport(
    period: TimePeriodInput!
    viewUserIDs: [ID!]
  ): FinancialReport!
}

extend type Account {
  reviewRevision: String!
  """
  Most recent transaction involving this account, either through a cash entry
  or an investment lot. Null when the account has never been used.
  """
  latestTransaction: Transaction
}

extend type TransactionCategory {
  """
  Most recent transaction assigned to this category. Null when the category
  has never been used.
  """
  latestTransaction: Transaction
}

extend type Investment {
  averageNeedsReview: Boolean!
  """
  Most recent transaction involving this investment. Null when the investment
  has no lots.
  """
  latestTransaction: Transaction

  """Remaining basis derived only from the user-confirmed average; null until reviewed."""
  costBasis: String
  """Last user-entered average, possibly needing review."""
  averageCost: String
  """Unavailable until average cost is confirmed after holding changes."""
  unrealizedReturn: String
  """Decimal fraction; unavailable for unconfirmed or zero cost basis."""
  unrealizedReturnPercent: String
}

extend type Snapshot {
  """The complete state as of this capture, resolved from shared immutable observations."""
  review: SnapshotReview
}
type SnapshotReview {
  version: Int!
  complete: Boolean!
  activeAccountIds: [ID!]!
  accounts: [SnapshotAccountState!]!
  rates: [SnapshotRateState!]!
}
# Historical projections deliberately have no Relay `id`: each snapshot owns
# its own inline state, while accountId/investmentId link to the live identity.
type SnapshotAccountState {
  accountId: ID!
  icon: String
  name: String!
  type: String!
  category: String
  ownerId: ID!
  ownerName: String!
  currency: String!
  cash: String!
  value: String!
  archived: Boolean!
  holdings: [SnapshotInvestmentState!]!
}
type SnapshotInvestmentState {
  investmentId: ID!
  name: String!
  symbol: String!
  currency: String!
  quantity: String!
  price: String!
  value: String!
  average: String
  confirmedAt: Time
  needsReview: Boolean!
  archived: Boolean!
}
type SnapshotRateState {
  from: String!
  to: String!
  rate: String!
}
